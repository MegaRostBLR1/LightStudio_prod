name: Generate WebP images

on:
  push:
    branches:
      - feat/webp-images

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert raster images to WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          find static/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 |
            while IFS= read -r -d '' file; do
              output="${file%.*}.webp"
              convert "$file" -strip -quality 85 "$output"
            done

      - name: Commit generated WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images
          if git diff --cached --quiet; then
            echo "No new WebP files to commit."
            exit 0
          fi
          git commit -m "chore: add WebP image variants"
          git push

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate WebP assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("static/images").rglob("*.webp"))
          if not files:
              raise SystemExit("No WebP assets found")

          errors = []
          for path in files:
              try:
                  with Image.open(path) as image:
                      image.load()
                      if image.format != "WEBP":
                          errors.append(f"{path}: detected format {image.format}")
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          print(f"Validated {len(files)} WebP assets")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
